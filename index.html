<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self Steer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <button id="restart" type="button" title="Restart (R)">↺ Restart</button>
  <aside id="controls" aria-label="Controls">
    <h2>Controls <span>H to hide</span></h2>
    <dl>
      <dt>W A S D / arrows</dt><dd>Drive</dd>
      <dt>B</dt><dd>ABS on/off</dd>
      <dt>T</dt><dd>Traction control on/off</dd>
      <dt>R</dt><dd>Restart</dd>
      <dt>V</dt><dd>Show sensors</dd>
      <dt>I</dt><dd>Let the trained AI drive</dd>
      <dt>N</dt><dd>Try an untrained AI</dd>
      <dt>G</dt><dd>Watch the AI train</dd>
      <dt>F</dt><dd>Training speed</dd>
    </dl>
  </aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
